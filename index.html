<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4 Hetes Étrend — Marcell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#291C0E;
    --light:#BEB5A9;
    --mid:#A78D78;
    --dark:#6E473B;
    --paper:#E1D4C2;
    --ink:#291C0E;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif; margin:0; letter-spacing:-0.01em;}

  /* HEADER */
  header{
    background:linear-gradient(160deg,var(--navy) 0%, var(--dark) 100%);
    color:var(--paper);
    padding:28px 20px 90px 20px;
    position:relative;
    overflow:hidden;
  }
  header .eyebrow{
    color:var(--light);
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-weight:600;
    margin-bottom:8px;
  }
  header h1{font-size:28px; font-weight:700;}
  header p.sub{color:var(--light); margin-top:6px; font-size:14.5px; max-width:520px;}

  /* clock signature */
  .clock-wrap{
    position:absolute; right:-40px; top:-30px; opacity:.9;
  }
  @media (max-width:640px){ .clock-wrap{display:none;} }

  nav{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    max-width:900px;
    margin:-56px auto 0 auto;
    padding:0 16px;
    position:relative;
    z-index:2;
  }
  nav button{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:13.5px;
    background:var(--paper);
    color:var(--dark);
    border:1px solid #e8dfd3;
    padding:12px 16px;
    border-radius:12px 12px 0 0;
    cursor:pointer;
    box-shadow:0 -2px 10px rgba(10,25,49,.08);
    transition:.15s;
  }
  nav button.active{
    background:var(--dark);
    color:white;
    border-color:var(--dark);
  }
  nav button:hover:not(.active){background:var(--light);}

  main{max-width:900px; margin:0 auto; padding:28px 16px 80px 16px;}

  .card{
    background:white;
    border:1px solid #e6dccd;
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 6px 20px rgba(41,28,14,.07);
  }
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  @media (max-width:700px){.grid2{grid-template-columns:1fr;}}

  .week-header-row{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:18px;}
  .tag-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:0;}
  .btn-pdf{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600; font-size:13px;
    background:var(--dark); color:white;
    border:none; border-radius:20px;
    padding:10px 18px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
    box-shadow:0 4px 12px rgba(41,28,14,.18);
    transition:transform .15s ease;
  }
  .btn-pdf:hover{transform:translateY(-1px);}
  .print-only{display:none;}

  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute; top:0; left:0; width:100%; padding:10px;}
    .print-only{display:block !important; margin-bottom:16px;}
  }
  .tag{
    background:var(--light);
    color:var(--dark);
    font-size:12px;
    font-weight:600;
    padding:5px 12px;
    border-radius:20px;
  }

  h2.section-title{
    font-size:20px;
    color:var(--dark);
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  h2.section-title::before{
    content:"";
    width:8px;height:8px;border-radius:50%;
    background:var(--mid);
    display:inline-block;
  }

  /* stats */
  .stat-row{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:20px;}
  .stat{
    background:var(--navy);
    color:var(--paper);
    border-radius:12px;
    padding:14px 18px;
    flex:1;
    min-width:130px;
  }
  .stat .num{font-family:'Space Grotesk'; font-size:22px; font-weight:700; color:var(--light);}
  .stat .label{font-size:11.5px; color:#d8c7b5; text-transform:uppercase; letter-spacing:.06em;}

  /* week overview cards */
  .week-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  @media (max-width:640px){.week-grid{grid-template-columns:1fr;}}
  .week-card{
    background:var(--paper);
    border:1px solid #e8dfd3;
    border-left:5px solid var(--mid);
    border-radius:10px;
    padding:14px 16px;
    cursor:pointer;
    transition:.15s;
  }
  .week-card:hover{transform:translateY(-2px); box-shadow:0 6px 16px rgba(41,28,14,.14);}
  .week-card .n{font-size:11px; color:var(--mid); font-weight:700; letter-spacing:.08em; text-transform:uppercase;}
  .week-card h3{font-size:17px; color:var(--dark); margin:4px 0 4px 0;}
  .week-card .p{font-size:12.5px; color:#7a6a5c;}

  /* shopping list */
  .shop-card-header{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:14px; margin-bottom:4px;}
  .shop-sub{font-size:12.5px; color:#8a7565; margin:4px 0 0 0; max-width:520px;}
  .shop-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:26px 32px; margin-top:18px;}
  @media (max-width:820px){ .shop-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .shop-grid{grid-template-columns:1fr;} }
  .shop-cat h4{font-size:14.5px; color:var(--dark); font-family:'Space Grotesk',sans-serif; font-weight:600; letter-spacing:0; text-transform:none; margin-bottom:10px; padding-bottom:7px; border-bottom:1.5px dashed var(--mid); display:flex; align-items:center; gap:7px;}
  ul.items{list-style:none; margin:0; padding:0;}
  ul.items li{display:flex; align-items:center; gap:8px; padding:6px 4px; border-radius:8px; font-size:13.5px;}
  ul.items li:hover{background:var(--paper);}
  ul.items li input[type=checkbox]{width:16px; height:16px; accent-color:var(--mid); cursor:pointer; flex:0 0 16px;}
  ul.items li .item-text{flex:1; outline:none; padding:2px 4px; border-radius:6px; line-height:1.35;}
  ul.items li .item-text:focus{background:white;}
  ul.items li.checked .item-text{text-decoration:line-through; color:#b3a493;}
  ul.items li .del{opacity:0; cursor:pointer; color:#c98a6f; font-weight:800; font-size:13px; flex:0 0 16px; text-align:center; transition:opacity .15s;}
  ul.items li:hover .del{opacity:1;}
  .add-row{margin-top:6px;}
  .add-row input{width:100%; font-family:'Inter',sans-serif; font-size:12.5px; padding:6px 8px; border-radius:8px; border:1px solid #e8dfd3; outline:none; box-sizing:border-box;}
  .add-row input:focus{border-color:var(--mid);}
  @media print{ .add-row, ul.items li .del{display:none;} }
  .progress-wrap{
    background:#ede3d6; border-radius:20px; height:8px; overflow:hidden; margin:10px 0 18px 0;
  }
  .progress-bar{background:var(--mid); height:100%; transition:width .2s;}

  /* meal prep box */
  .prepbox{background:var(--dark); color:var(--paper); border-radius:12px; padding:16px 18px;}
  .prepbox h4{color:var(--light); font-size:13px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px;}
  .prepbox p{font-size:13.5px; line-height:1.5; margin:0 0 12px 0; color:#ecdfd2;}
  .prepbox .cost{font-size:12px; color:var(--light); font-style:italic;}

  /* daily table */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{background:var(--dark); color:white; text-align:left; padding:8px 10px; font-weight:600;}
  td{border-bottom:1px solid #ecdfd2; padding:8px 10px;}
  tr:nth-child(even) td{background:#faf6f0;}

  /* recipes */
  .recipe-filter{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .recipe-filter button{
    background:white; border:1px solid #e8dfd3; color:var(--dark);
    padding:7px 14px; border-radius:20px; font-size:12.5px; font-weight:600; cursor:pointer;
    transition:.15s;
  }
  .recipe-filter button.active{background:var(--dark); color:white; border-color:var(--dark);}
  .recipe-filter button:hover:not(.active){background:var(--paper);}

  .recipe-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:20px;}
  .recipe-card{
    background:white;
    border-radius:16px;
    box-shadow:0 6px 20px rgba(41,28,14,.09);
    padding:20px 22px;
    transition:transform .18s ease, box-shadow .18s ease;
    display:flex;
    flex-direction:column;
  }
  .recipe-card:hover{transform:translateY(-3px); box-shadow:0 10px 28px rgba(41,28,14,.15);}
  .recipe-card h4{color:var(--dark); font-size:16px; margin-bottom:6px; line-height:1.3;}
  .recipe-card .meta{
    display:inline-block; align-self:flex-start;
    font-size:11px; color:var(--dark); font-weight:700; letter-spacing:.02em;
    margin-bottom:14px; background:var(--paper); padding:4px 10px; border-radius:20px;
  }
  .recipe-card h5{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:#a89686; margin:0 0 6px 0; font-weight:700;}
  .recipe-card .ingredients{margin-bottom:14px;}
  .recipe-card .ingredients ul{margin:0; padding-left:16px; font-size:13px; color:#4a3f36; line-height:1.65;}
  .recipe-card .steps ol{margin:0; padding-left:16px; font-size:13px; line-height:1.7; color:#332920;}
  .recipe-card .tip{
    background:var(--light);
    border-radius:10px;
    padding:10px 12px;
    font-size:11.5px;
    line-height:1.5;
    margin-top:16px;
    color:#33261b;
  }
  .recipe-card .tip::before{
    content:"💡 Tipp"; display:block; font-weight:800; font-size:10px;
    letter-spacing:.05em; margin-bottom:3px; color:var(--dark);
  }

  footer{text-align:center; padding:30px; font-size:12px; color:#a89686;}

  /* today banner */
  .today-banner{
    background:linear-gradient(160deg,var(--navy) 0%, var(--dark) 100%);
    color:var(--paper);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-top:20px;
    box-shadow:0 8px 24px rgba(41,28,14,.18);
  }
  .today-banner-top{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;}
  .tb-tag{background:rgba(255,255,255,.12); color:var(--light); font-size:11.5px; font-weight:700; padding:4px 12px; border-radius:20px; letter-spacing:.04em; text-transform:uppercase;}
  .tb-slot{background:var(--mid); color:var(--navy);}
  .today-banner h3{font-size:19px; color:white; margin:4px 0 2px 0;}
  .today-banner .meta{font-size:12.5px; color:var(--light);}
  .tb-link{
    margin-top:12px; background:none; border:1px solid rgba(255,255,255,.3); color:var(--paper);
    font-family:'Space Grotesk',sans-serif; font-size:12.5px; font-weight:600;
    padding:7px 14px; border-radius:20px; cursor:pointer;
  }
  .tb-link:hover{background:rgba(255,255,255,.1);}
  @media print{ .today-banner{display:none;} }

  /* napló (weight + water) */
  .field-label{font-size:11px; color:var(--mid); display:block; margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em;}
  .field-input{padding:8px 10px; border-radius:8px; border:1px solid #e8dfd3; font-family:'Inter',sans-serif; font-size:13.5px;}
  .goal-details summary{cursor:pointer; font-size:12px; color:var(--mid); font-weight:600;}
  .water-drop{
    width:38px; height:38px; border-radius:50%; border:2px solid #e8dfd3; background:white;
    font-size:16px; cursor:pointer; opacity:.35; transition:.15s ease;
  }
  .water-drop.filled{opacity:1; border-color:var(--mid); background:var(--paper); transform:scale(1.06);}
  .water-drop:hover{opacity:.7;}
  .weight-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:7px 4px; border-bottom:1px solid #ecdfd2; font-size:13px;
  }
  .weight-row button{background:none; border:none; color:#c98a6f; cursor:pointer; font-size:12px;}
  .sync-note{font-size:11.5px; color:#a89686; margin-top:10px; font-style:italic;}
  .sync-badge{
    display:inline-block; margin-left:10px; font-size:11px; font-weight:600;
    padding:3px 10px; border-radius:20px; background:rgba(255,255,255,.12); color:var(--light);
    text-transform:none; letter-spacing:0;
  }
  .sync-badge.ok{background:rgba(167,193,150,.25); color:#c9e6bd;}
  .sync-badge.err{background:rgba(217,140,120,.25); color:#f0c2b2;}
</style>
</head>
<body>

<header>
  <div class="clock-wrap">
    <svg width="220" height="220" viewBox="0 0 220 220">
      <circle cx="110" cy="110" r="95" fill="none" stroke="#6b4a3a" stroke-width="1.5"/>
      <circle cx="110" cy="110" r="70" fill="none" stroke="#6b4a3a" stroke-width="1" stroke-dasharray="2 5"/>
      <!-- meal points: 14h, 19:30h, 0h, 6:30h mapped on 24h circle -->
      <g id="clockPoints"></g>
      <text x="110" y="20" fill="#d8c7b5" font-size="10" text-anchor="middle" font-family="Space Grotesk">00</text>
      <text x="200" y="114" fill="#d8c7b5" font-size="10" text-anchor="middle" font-family="Space Grotesk">06</text>
      <text x="110" y="204" fill="#d8c7b5" font-size="10" text-anchor="middle" font-family="Space Grotesk">12</text>
      <text x="20" y="114" fill="#d8c7b5" font-size="10" text-anchor="middle" font-family="Space Grotesk">18</text>
    </svg>
  </div>
  <div class="eyebrow">Éjszakai műszakhoz igazítva · 22:00–06:00 <span class="sync-badge" id="syncBadge"></span></div>
  <h1>4 Hetes Étrendi Rendszer</h1>
  <p class="sub">Fogyáshoz és energiaszint-tartáshoz hangolva — kizárólag csirkéből, halból és pulykából, túró nélkül.</p>
</header>

<nav id="tabs"></nav>

<div style="max-width:900px; margin:0 auto; padding:0 16px;" id="todayBanner"></div>

<main id="main"></main>

<div style="max-width:900px; margin:0 auto; padding:0 16px;">
  <h2 class="section-title" style="justify-content:center; margin:10px 0 20px 0;">Receptgyűjtemény</h2>
  <div id="recipesSection"></div>
</div>

<footer>Készült Marcellnek · 2026</footer>

  R16:{name:"Tortilla tekercs", cat:"uzsonna", time:"Kb. 5 perc", kcal:"~400 kcal · 28 g fehérje",

/* ================= FELHŐ-SZINKRON =================
   Ugyanazt a Firebase Realtime Database-t használjuk, mint Anett "Baba Étrend"
   oldala (DB_URL) — de más ág (DB_PATH) alá mentünk, így a két oldal adatai
   sosem keverednek vagy írják felül egymást: az övé "babaetrend/...",
   a tiéd "marcell/..." alatt él ugyanabban az adatbázisban.
   Nincs szükség API-kulcsra, mert a Realtime Database REST végpontját
   (fetch + .json) hívjuk, ugyanúgy, ahogy az ő oldala is teszi.
================================================================== */
const DB_URL = "https://dietplan-ab4ef-default-rtdb.europe-west1.firebasedatabase.app";
const DB_PATH = "marcell";
const STORAGE_PREFIX = "etrend_marcell_";

const syncBadge = document.getElementById('syncBadge');
function setSyncBadge(text, cls){
  if(!syncBadge) return;
  syncBadge.textContent = text;
  syncBadge.className = 'sync-badge ' + (cls||'');
}

async function fetchRemote(key){
  const res = await fetch(`${DB_URL}/${DB_PATH}/${key}.json`);
  if(!res.ok) throw new Error("HTTP " + res.status);
  return await res.json();
}
async function pushRemote(key, value){
  const res = await fetch(`${DB_URL}/${DB_PATH}/${key}.json`, {
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(value)
  });
  if(!res.ok) throw new Error("HTTP " + res.status);
}

const STORE = {
  async get(key, fallback){
    try{
      const remote = await fetchRemote(key);
      if(remote !== null && remote !== undefined){
        try{ localStorage.setItem(STORAGE_PREFIX+key, JSON.stringify(remote)); }catch(e){}
        setSyncBadge("☁️ Szinkronban ✓", "ok");
        return remote;
      }
    }catch(e){
      setSyncBadge("⚠️ Csak helyi mentés", "err");
      console.warn('Felhő olvasási hiba, localStorage-ra váltunk:', e);
    }
    try{
      const raw = localStorage.getItem(STORAGE_PREFIX+key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  },
  async set(key, value){
    try{ localStorage.setItem(STORAGE_PREFIX+key, JSON.stringify(value)); }catch(e){}
    try{ await pushRemote(key, value); setSyncBadge("☁️ Szinkronban ✓", "ok"); }
    catch(e){ setSyncBadge("⚠️ Csak helyi mentés", "err"); console.warn('Felhő mentési hiba:', e); }
  }
};

/* Több eszköz (pl. telefon + gép) között tartja szinkronban a bevásárlólistát,
   amíg a bolt fülnél nyitva a lap — ugyanúgy, ahogy Anett oldala is teszi. */
function startShoppingPolling(){
  setInterval(async ()=>{
    if(isEditingShopping) return;
    try{
      const remote = await fetchRemote('shopping');
      if(remote && JSON.stringify(remote) !== JSON.stringify(shoppingState)){
        shoppingState = remote;
        try{ localStorage.setItem(STORAGE_PREFIX+'shopping', JSON.stringify(shoppingState)); }catch(e){}
        if(activeTab!=='overview' && activeTab!=='napló') render();
      }
      setSyncBadge("☁️ Szinkronban ✓", "ok");
    }catch(e){ setSyncBadge("⚠️ Csak helyi mentés", "err"); }
  }, 20000);
}

function updateShoppingProgress(weekId){
  const items = Object.values(shoppingState[weekId]).flat();
  const total = items.length;
  const checked = items.filter(it=>it.checked).length;
  const bar = document.getElementById('progressBar');
  if(bar) bar.style.width = (total? checked/total*100:0)+'%';
}

function bindShoppingEvents(weekId){
  const wState = shoppingState[weekId];
  mainEl.querySelectorAll('.items').forEach(ul=>{
    const cat = ul.dataset.cat;
    ul.querySelectorAll('li').forEach(li=>{
      const idx = parseInt(li.dataset.idx);
      const cb = li.querySelector('input[type=checkbox]');
      const span = li.querySelector('.item-text');
      const del = li.querySelector('.del');
      cb.onchange = ()=>{
        wState[cat][idx].checked = cb.checked;
        li.classList.toggle('checked', cb.checked);
        updateShoppingProgress(weekId);
        STORE.set('shopping', shoppingState);
      };
      span.addEventListener('focus', ()=>{ isEditingShopping = true; });
      span.addEventListener('blur', ()=>{
        isEditingShopping = false;
        const val = span.textContent.trim();
        wState[cat][idx].text = val || wState[cat][idx].text;
        span.textContent = wState[cat][idx].text;
        STORE.set('shopping', shoppingState);
      });
      span.addEventListener('keydown', (e)=>{
        if(e.key==='Enter'){ e.preventDefault(); span.blur(); }
      });
      del.onclick = ()=>{
        wState[cat].splice(idx,1);
        STORE.set('shopping', shoppingState);
        render();
      };
    });
  });
  mainEl.querySelectorAll('.add-row input').forEach(inp=>{
    const cat = inp.dataset.cat;
    inp.addEventListener('focus', ()=>{ isEditingShopping = true; });
    inp.addEventListener('blur', ()=>{ isEditingShopping = false; });
    inp.addEventListener('keydown', (e)=>{
      if(e.key==='Enter' && inp.value.trim()){
        wState[cat].push({text:inp.value.trim(), checked:false});
        STORE.set('shopping', shoppingState);
        render();
      }
    });
  });
  const resetBtn = mainEl.querySelector(`[data-reset-week="${weekId}"]`);
  if(resetBtn) resetBtn.onclick = ()=>{
    if(confirm("Biztosan visszaállítod ennek a hétnek a bevásárlólistáját az eredeti állapotra? A saját tételeid és pipáid elvesznek.")){
      delete shoppingState[weekId];
      ensureShoppingWeek(weekId);
      STORE.set('shopping', shoppingState);
      render();
    }
  };
}

function renderRecipesSection(){
  const cats = [["mind","Mind"],["reggeli","Ébredés"],["fő","Fő étkezés"],["uzsonna","Uzsonna"],["könnyű","Hazaérkezés"]];
  const filtered = Object.entries(RECIPES).filter(([code,r])=> recipeFilter==='mind' || r.cat===recipeFilter);
  const el = document.getElementById('recipesSection');
  el.innerHTML = `
  <div class="recipe-filter">
    ${cats.map(([id,label])=>`<button data-filter="${id}" class="${recipeFilter===id?'active':''}">${label}</button>`).join('')}
  </div>
  <div class="recipe-grid">
  ${filtered.map(([code,r])=>`
    <div class="recipe-card">
      <h4>${code} – ${r.name}</h4>
      <span class="meta">${r.time} · ${r.kcal}</span>
      <div class="ingredients">
        <h5>Hozzávalók</h5>
        <ul>${r.ing.map(i=>`<li>${i}</li>`).join('')}</ul>
      </div>
      <div class="steps">
        <h5>Elkészítés</h5>
        <ol>${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
      </div>
      ${r.tip? `<div class="tip">${r.tip}</div>`:''}
    </div>`).join('')}
  </div>
  `;
  el.querySelectorAll('.recipe-filter button').forEach(b=>{
    b.onclick = ()=>{ recipeFilter = b.dataset.filter; renderRecipesSection(); };
  });
}

function render(){
  buildTabs();
  if(activeTab==='overview'){ mainEl.innerHTML = renderOverview(); }
  else if(activeTab==='napló'){ mainEl.innerHTML = renderNaplo(); bindNaploEvents(); }
  else {
    const w = WEEKS.find(x=>String(x.id)===String(activeTab));
    mainEl.innerHTML = renderWeek(w);
    bindShoppingEvents(w.id);
  }
}

/* ================= NAPLÓ: TESTSÚLY + VÍZ ================= */
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function renderWeightChart(){
  if(weightLog.length===0){
    return `<p style="font-size:13px;color:#a89686;">Még nincs rögzített mérés — add hozzá az elsőt lent.</p>`;
  }
  const sorted = [...weightLog].sort((a,b)=>a.date.localeCompare(b.date));
  const weights = sorted.map(e=>e.weight);
  const minW = Math.min(goal.target, ...weights) - 3;
  const maxW = Math.max(goal.start, ...weights) + 3;
  const W=640,H=190,padL=38,padR=14,padT=14,padB=24;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const xFor = i => padL + (sorted.length===1? plotW/2 : (i/(sorted.length-1))*plotW);
  const yFor = w => padT + plotH - ((w-minW)/(maxW-minW))*plotH;
  const points = sorted.map((e,i)=>`${xFor(i).toFixed(1)},${yFor(e.weight).toFixed(1)}`).join(' ');
  const goalY = yFor(goal.target).toFixed(1);
  return `
  <svg viewBox="0 0 ${W} ${H}" width="100%" height="190" style="overflow:visible;">
    <line x1="${padL}" y1="${goalY}" x2="${W-padR}" y2="${goalY}" stroke="var(--mid)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${W-padR}" y="${Number(goalY)-6}" text-anchor="end" font-size="11" fill="var(--mid)" font-family="Space Grotesk">Cél: ${goal.target} kg</text>
    <polyline points="${points}" fill="none" stroke="var(--dark)" stroke-width="2.5"/>
    ${sorted.map((e,i)=>`<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(e.weight).toFixed(1)}" r="4" fill="var(--dark)"/>`).join('')}
    ${sorted.map((e,i)=> (i===0||i===sorted.length-1)? `<text x="${xFor(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" fill="#a89686">${e.date.slice(5)}</text>`:'').join('')}
  </svg>`;
}

function renderNaplo(){
  const today = todayStr();
  const last = weightLog.length ? [...weightLog].sort((a,b)=>a.date.localeCompare(b.date)).at(-1).weight : goal.start;
  const lost = (goal.start - last).toFixed(1);
  const remaining = (last - goal.target).toFixed(1);
  const glassMl = 250;
  const targetGlasses = Math.max(1, Math.round((waterTarget*1000)/glassMl));
  const todayWater = waterLog[today] || 0;

  return `
  <div class="grid2">
    <div class="card">
      <h2 class="section-title">Testsúly-napló</h2>
      <div class="stat-row" style="margin-bottom:16px;">
        <div class="stat"><div class="num">${last} kg</div><div class="label">Legutóbbi mérés</div></div>
        <div class="stat"><div class="num">${lost} kg</div><div class="label">Leadva eddig</div></div>
        <div class="stat"><div class="num">${remaining} kg</div><div class="label">Hátra a célig</div></div>
      </div>
      ${renderWeightChart()}
      <div style="display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; align-items:flex-end;">
        <div><label class="field-label">Dátum</label><input type="date" id="weightDate" class="field-input" value="${today}"></div>
        <div><label class="field-label">Testsúly (kg)</label><input type="number" step="0.1" id="weightInput" class="field-input" style="width:100px;" placeholder="pl. 112.4"></div>
        <button class="btn-pdf" id="addWeightBtn">+ Mentés</button>
      </div>
      ${weightLog.length ? `
      <div style="margin-top:16px; max-height:150px; overflow-y:auto;">
        ${[...weightLog].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`
          <div class="weight-row"><span>${e.date}</span><span><b>${e.weight} kg</b> <button data-date="${e.date}" class="delWeightBtn">törlés</button></span></div>
        `).join('')}
      </div>` : ''}
      <details class="goal-details" style="margin-top:14px;">
        <summary>Cél módosítása (jelenleg ${goal.start} → ${goal.target} kg)</summary>
        <div style="display:flex; gap:10px; margin-top:10px; align-items:flex-end;">
          <div><label class="field-label">Kiinduló (kg)</label><input type="number" id="goalStart" class="field-input" style="width:90px;" value="${goal.start}"></div>
          <div><label class="field-label">Cél (kg)</label><input type="number" id="goalTarget" class="field-input" style="width:90px;" value="${goal.target}"></div>
          <button class="btn-pdf" id="saveGoalBtn" style="background:var(--mid);">Mentés</button>
        </div>
      </details>
    </div>

    <div class="card">
      <h2 class="section-title">Vízfogyasztás — ma</h2>
      <p style="font-size:12.5px; color:#8a7565; margin:-6px 0 14px 0;">Cél: ${waterTarget} liter/nap. Műszak közben könnyű kihagyni — pipáld a poharakat, ahogy iszol.</p>
      <div class="progress-wrap"><div class="progress-bar" style="width:${Math.min(100,(todayWater/targetGlasses*100)).toFixed(0)}%"></div></div>
      <div style="display:flex; flex-wrap:wrap; gap:8px; margin:14px 0;">
        ${Array.from({length:targetGlasses}).map((_,i)=>`<button class="water-drop ${i<todayWater?'filled':''}" data-i="${i+1}" title="${(i+1)*glassMl} ml">💧</button>`).join('')}
      </div>
      <p style="font-size:13.5px; color:var(--dark); font-weight:700;">${(todayWater*glassMl/1000).toFixed(2)} / ${waterTarget} liter</p>
      <details class="goal-details" style="margin-top:12px;">
        <summary>Napi cél módosítása</summary>
        <div style="display:flex; gap:10px; margin-top:10px; align-items:flex-end;">
          <input type="number" step="0.25" id="waterTargetInput" class="field-input" style="width:90px;" value="${waterTarget}">
          <button class="btn-pdf" id="saveWaterTargetBtn" style="background:var(--mid);">Mentés</button>
        </div>
      </details>
      <p class="sync-note">☁ Közös Firebase adatbázis Anett oldalával, de külön mentve (marcell/…) — a fenti szinkron-jelző mutatja az aktuális állapotot.</p>
    </div>
  </div>`;
}

function bindNaploEvents(){
  const addBtn = document.getElementById('addWeightBtn');
  if(addBtn) addBtn.onclick = async ()=>{
    const date = document.getElementById('weightDate').value;
    const w = parseFloat(document.getElementById('weightInput').value);
    if(!date || !w) return;
    weightLog = weightLog.filter(e=>e.date!==date);
    weightLog.push({date, weight:w});
    await STORE.set('weight', weightLog);
    render();
  };
  document.querySelectorAll('.delWeightBtn').forEach(b=>{
    b.onclick = async ()=>{
      weightLog = weightLog.filter(e=>e.date!==b.dataset.date);
      await STORE.set('weight', weightLog);
      render();
    };
  });
  const saveGoalBtn = document.getElementById('saveGoalBtn');
  if(saveGoalBtn) saveGoalBtn.onclick = async ()=>{
    goal = {
      start: parseFloat(document.getElementById('goalStart').value) || goal.start,
      target: parseFloat(document.getElementById('goalTarget').value) || goal.target
    };
    await STORE.set('goal', goal);
    render();
  };
  document.querySelectorAll('.water-drop').forEach(btn=>{
    btn.onclick = async ()=>{
      const today = todayStr();
      const clicked = parseInt(btn.dataset.i);
      const current = waterLog[today] || 0;
      waterLog[today] = (current===clicked) ? clicked-1 : clicked;
      await STORE.set('water', {log:waterLog, target:waterTarget});
      render();
    };
  });
  const saveWaterTargetBtn = document.getElementById('saveWaterTargetBtn');
  if(saveWaterTargetBtn) saveWaterTargetBtn.onclick = async ()=>{
    waterTarget = parseFloat(document.getElementById('waterTargetInput').value) || waterTarget;
    await STORE.set('water', {log:waterLog, target:waterTarget});
    render();
  };
}

/* ================= MA MIT EGYÜNK ================= */
const DAY_NAMES = ["Hétfő","Kedd","Szerda","Csütörtök","Péntek","Szombat","Vasárnap"];

function getShiftInfo(now){
  const h = now.getHours() + now.getMinutes()/60;
  const shiftDate = new Date(now);
  if (h < 13) shiftDate.setDate(shiftDate.getDate()-1);
  shiftDate.setHours(0,0,0,0);
  const dayIndexMon0 = (shiftDate.getDay()+6)%7; // 0=Hétfő ... 6=Vasárnap
  const hoursSinceWake = ((h - 14) + 24) % 24;
  return {shiftDate, dayIndexMon0, hoursSinceWake};
}

function getCurrentWeekNumber(shiftDate){
  const diffDays = Math.floor((shiftDate - CYCLE_START_DATE) / 86400000);
  return (((Math.floor(diffDays/7) % 4) + 4) % 4) + 1;
}

function renderTodayBanner(){
  const el = document.getElementById('todayBanner');
  if(!el) return;
  const now = new Date();
  const {shiftDate, dayIndexMon0, hoursSinceWake} = getShiftInfo(now);
  const weekNum = getCurrentWeekNumber(shiftDate);
  const week = WEEKS.find(w=>w.id===weekNum);
  const isWorkday = dayIndexMon0 <= 3;
  const dayName = DAY_NAMES[dayIndexMon0];

  let slotLabels, slotTimes, dayArr;
  if(isWorkday){
    slotLabels = ["Ébredés","Műszak előtt","Műszak közben","Hazaérkezés"];
    slotTimes = [0, 5.5, 10, 16.5];
    dayArr = week.days.find(d=>d[0]===dayName);
  } else {
    slotLabels = ["Reggeli","Ebéd","Uzsonna","Vacsora"];
    slotTimes = [0, 3.5, 6.5, 9.5];
    dayArr = week.weekend.find(d=>d[0]===dayName);
  }
  let slotIdx = 0;
  for(let i=0;i<slotTimes.length;i++){ if(hoursSinceWake >= slotTimes[i]) slotIdx = i; }
  const code = dayArr ? dayArr[1+slotIdx] : null;
  const recipe = code ? RECIPES[code] : null;

  el.innerHTML = `
    <div class="today-banner">
      <div class="today-banner-top">
        <span class="tb-tag">${weekNum}. hét · ${dayName}</span>
        <span class="tb-tag tb-slot">Most: ${slotLabels[slotIdx]}</span>
      </div>
      ${recipe ? `
        <h3>${code} – ${recipe.name}</h3>
        <span class="meta">${recipe.time} · ${recipe.kcal}</span>
      ` : `<p style="margin:6px 0 0 0; color:var(--paper);">Nincs recept ehhez az időponthoz — nézd meg a heti bontást.</p>`}
      <button class="tb-link" onclick="activeTab='${weekNum}'; render(); window.scrollTo({top:0,behavior:'smooth'});">Ugrás a(z) ${weekNum}. hétre →</button>
    </div>`;
}


function printWeek(weekId){
  document.querySelectorAll('[id^="printArea-"]').forEach(el=>{
    if(el.id === `printArea-${weekId}`) el.setAttribute('id','printArea');
  });
  window.print();
  setTimeout(()=>{
    document.querySelectorAll('#printArea').forEach(el=>{
      el.id = `printArea-${weekId}`;
    });
  }, 500);
}

async function initApp(){
  setSyncBadge("☁️ Csatlakozás...", "");
  shoppingState = await STORE.get('shopping', {});
  weightLog = await STORE.get('weight', []);
  goal = await STORE.get('goal', {start:116, target:80});
  const water = await STORE.get('water', {log:{}, target:2.5});
  waterLog = water.log || {};
  waterTarget = water.target || 2.5;
  render();
  renderRecipesSection();
  renderTodayBanner();
  startShoppingPolling();
}
initApp();
</script>
